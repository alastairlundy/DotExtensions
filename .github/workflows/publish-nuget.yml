# This workflow will build and publish System Extensions to Nuget.

name: Publish to Nuget

on:
  workflow_dispatch:
    
permissions:
  contents: read

jobs:
  publish-nuget:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write 
    environment: production

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
        working-directory: DotExtensions
    
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
            user: ${{ secrets.NUGET_USER }}
    
    - name: Restore dependencies
      run: dotnet restore
    - name: Create the MAIN package
      run: dotnet build DotExtensions/DotExtensions.csproj -c Release -p:ExposeInternalsToFirstPartyProjects=false
    - name: Create the Memory package
      run: dotnet build DotExtensions.Memory/DotExtensions.Memory.csproj -c Release
    - name: Publish the MAIN package to nuget.org
      run: dotnet nuget push DotExtensions/bin/Release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}}  -s https://api.nuget.org/v3/index.json --skip-duplicate
    - name: Publish the Memory package to nuget.org
      run: dotnet nuget push DotExtensions.Memory/bin/Release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}}  $NUGET_AUTH_TOKEN -s https://api.nuget.org/v3/index.json --skip-duplicate
